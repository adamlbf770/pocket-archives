<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#111a18" />
    <title>Pocket Archives — Offline</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #111a18; background: #f5f7f6; }
      main { width: min(440px, 100%); padding: 34px; border: 1px solid #dfe7e3; border-radius: 24px; background: #fff; box-shadow: 0 18px 60px rgba(17, 26, 24, .08); }
      img { width: 52px; height: 52px; border-radius: 14px; }
      h1 { margin: 24px 0 8px; font: 700 28px/1.1 Georgia, serif; letter-spacing: -.03em; }
      p { margin: 0 0 24px; color: #5f6c67; line-height: 1.55; }
      button { border: 0; border-radius: 12px; padding: 12px 18px; color: #fff; background: #111a18; font: 700 14px/1 system-ui, sans-serif; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa-icon-192.png" alt="" />
      <h1>You’re offline</h1>
      <p>Pocket Archives needs a connection to load current inventory and private market data.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
